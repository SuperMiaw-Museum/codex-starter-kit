<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-labelledby="t d"><title id="t">Codex Starter Kit architecture</title><desc id="d">ChatGPT accesses the isolated Linux VM through Remote Desktop Commander. The user accesses the VM through SSH. Remote execution and Codex CLI run inside the VM, while task notifications appear in SSH terminals.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#397e9c"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#26394c}.cap{font-size:14px;font-weight:bold;letter-spacing:1.2px;fill:#587287}.head{font-size:21px;font-weight:bold}.sub{font-size:14px;fill:#62798b}.node{fill:#fff;stroke:#c5d5e1;stroke-width:1.5}.link{fill:none;stroke:#397e9c;stroke-width:2.5;marker-end:url(#a)}.dash{fill:none;stroke:#8296a7;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}</style></defs><rect width="1080" height="650" rx="14" fill="#fafcfe"/><rect x="35" y="75" width="1010" height="150" rx="12" fill="#f0f5f9" stroke="#d1dee8"/><text x="55" y="45" class="head">CODEX STARTER KIT</text><text x="1025" y="45" class="cap" text-anchor="end">PHYSICAL &amp; FUNCTIONAL ARCHITECTURE</text><text x="55" y="104" class="cap">USER WORKSTATION</text><rect class="node" x="70" y="127" width="280" height="74" rx="9"/><text x="90" y="156" class="head">ChatGPT</text><text x="90" y="181" class="sub">Discuss / specify / review</text><rect class="node" x="730" y="127" width="280" height="74" rx="9"/><text x="750" y="156" class="head">SSH terminal</text><text x="750" y="181" class="sub">Human access / notifications</text><rect x="35" y="285" width="1010" height="325" rx="12" fill="#f0f5f9" stroke="#d1dee8"/><text x="55" y="316" class="cap">ISOLATED LINUX VM / SANDBOX</text><rect class="node" x="70" y="342" width="280" height="76" rx="9"/><text x="90" y="370" class="head">Desktop Commander</text><text x="90" y="394" class="sub">Remote command bridge</text><rect class="node" x="730" y="342" width="280" height="76" rx="9"/><text x="750" y="370" class="head">SSH server</text><text x="750" y="394" class="sub">Interactive sessions</text><rect class="node" x="70" y="474" width="280" height="83" rx="9"/><text x="90" y="503" class="head">Direct execution</text><text x="90" y="528" class="sub">Inspect / run commands</text><rect class="node" x="400" y="474" width="280" height="83" rx="9"/><text x="420" y="503" class="head">Codex CLI</text><text x="420" y="528" class="sub">Async implementation / tests</text><rect class="node" x="730" y="474" width="280" height="83" rx="9"/><text x="750" y="503" class="head">Task notifications</text><text x="750" y="528" class="sub">START / END / ERROR / count</text><path class="link" d="M210 201V342"/><path class="link" d="M870 201V342"/><path class="link" d="M210 418V474"/><path class="link" d="M350 380H540V474"/><path class="dash" d="M680 515H730"/><path class="dash" d="M350 541H375V585H870V557"/><path class="dash" d="M870 474V418"/><text x="55" y="634" class="sub">Solid: access / execution   ·   Dashed: task status and terminal feedback</text></svg>