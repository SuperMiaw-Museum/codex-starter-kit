name: Checks

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./release.sh --check
      - run: find bootstrap -type f -name '*.sh' -exec bash -n {} \;

  draft-release:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare GitHub release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$releases"; then
            echo "GitHub Release already exists for $GITHUB_REF_NAME; unchanged."
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
